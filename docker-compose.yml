# ============================================================
# docker-compose.yml — Corre en la TABLET (nodo coordinador)
# Levanta RabbitMQ + PostgreSQL
# ============================================================
# Uso:
#   docker-compose up -d
#   Luego correr el coordinador: python coordinador/app.py
# ============================================================

version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"      # AMQP (los workers se conectan acá)
      - "15672:15672"    # Interfaz web de RabbitMQ (http://localhost:15672)
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped

  postgres:
    image: postgres:15
    container_name: postgres
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: plataforma_multimedia
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

volumes:
  rabbitmq_data:
  postgres_data:
